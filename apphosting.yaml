runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
      - BUILD
  # Install the compiler/tooling without compiling a development-mode application.
  - variable: NPM_CONFIG_INCLUDE
    value: dev
    availability:
      - BUILD
